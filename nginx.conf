server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(online-(config|loader|client)|i18n)\.js$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~ ^/(data|db|nakama|scripts)/ {
    return 404;
  }

  location ~ /\. {
    deny all;
    return 404;
  }
}
