services:
  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - nakama_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-game-content.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10
  nakama:
    image: docker.io/heroiclabs/nakama:3.40.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address "postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama"
        exec /nakama/nakama \
          --name nakama1 \
          --database.address "postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama" \
          --socket.server_key "${NAKAMA_SERVER_KEY}" \
          --session.encryption_key "${NAKAMA_SESSION_ENCRYPTION_KEY}" \
          --session.refresh_encryption_key "${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}" \
          --session.token_expiry_sec 3600 \
          --session.refresh_token_expiry_sec 2592000 \
          --runtime.http_key "${NAKAMA_RUNTIME_HTTP_KEY}" \
          --runtime.path "/nakama/data/modules" \
          --runtime.js_entrypoint "index.js" \
          --runtime.js_read_only_globals false \
          --console.username "${NAKAMA_CONSOLE_USERNAME}" \
          --console.password "${NAKAMA_CONSOLE_PASSWORD}" \
          --console.signing_key "${NAKAMA_CONSOLE_SIGNING_KEY}"
    ports:
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ./nakama/modules:/nakama/data/modules:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nakama_postgres_data:
